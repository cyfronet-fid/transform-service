name: Transform styles

on: push

jobs:
  backend:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.13.7'
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --locked
        
      - name: Check with black
        run: |
          uv run --locked black --version
          uv run --locked black --check app tests eosc_pl
          
      - name: Check with isort
        run: |
          uv run --locked isort . --check --diff
#    - name: Lint with pylint
#      run: |
#        uv run --locked pylint app tests eosc_pl
