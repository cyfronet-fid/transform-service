name: Test

on: push

jobs:
  transform:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: '0.13.7'
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --locked
        
      - name: Run tests
        run: uv run --locked python -m pytest
